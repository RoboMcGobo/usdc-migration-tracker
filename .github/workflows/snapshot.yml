name: Daily USDC migration snapshot

on:
  schedule:
    - cron: "10 6 * * *"   # 06:10 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh chain registry config
        run: python3 scripts/build_config.py || echo "config refresh failed; using committed data/config.json"

      - name: Take snapshot
        run: python3 scripts/snapshot.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/config.json data/snapshots.json data/last_run_full.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
